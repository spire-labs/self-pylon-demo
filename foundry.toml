[profile.default]
solc_version = '0.8.28'
optimizer = true
optimizer_runs = 200
src = 'contracts/src'
test = 'contracts/test'
script = 'contracts/script'
out = 'contracts/out'
libs = ['contracts/lib']
allow_paths = [
    'node_modules',
    '../celo-self-contracts/lib/forge-std'
]
remappings = [
    'celo-self-contracts/=node_modules/celo-self-contracts/',
    '@selfxyz/contracts/=node_modules/@selfxyz/contracts/',
    '@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/',
    'forge-std/=../celo-self-contracts/lib/forge-std/src/'
]
fs_permissions = [{ access = 'read', path = '.' }]

[rpc_endpoints]
celo_l2 = '${CELO_L2_RPC_URL}'
pylon = '${PYLON_RPC_URL}'
