[profile.default]
solc_version = '0.8.28'
optimizer = true
optimizer_runs = 200
src = 'src'
out = 'out'
libs = ['lib']
remappings = [
    "@selfxyz/=lib/selfxyz-contracts/",
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

[rpc_endpoints]
celo_l2 = "${CELO_L2_RPC_URL}"
pylon = "${PYLON_RPC_URL}"

